    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -std=gnu++17
    -O3
    -ffast-math
    -funroll-loops
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2

; Diagnostico do MPU6050 (test/bench/i2c_scan.cpp) — o firmware de voo trava em
; while(1) se o mpu.begin(0x68) falhar (lib/utils/utils.cpp:19-24); este env
; varre o barramento inteiro pra achar o endereco real e confirmar fiacao.
[env:i2c_scan]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_src_filter = -<*> +<../test/bench/i2c_scan.cpp>
build_flags =
    -std=gnu++17
    -O3

