    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -DFXQ_INSTRUMENT
    -std=gnu++17
    -O3
    -ffast-math
    -funroll-loops
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2

; Mesmo harness de verify_gains, mas SEM -DFXQ_INSTRUMENT — mede o tempo do
; SDA_FIXED (e demais _FIXED) exatamente como ele roda no caminho de voo
; (env:esp32-s2-saola-1), sem o custo do rastreio de max_abs_seen. Uso para
; confirmar a correcao da regressao de ~15% da Secao 10 da auditoria.
[env:verify_gains_flight]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
build_src_filter = -<*> +<../test/bench/verify_gains_onboard.cpp>
