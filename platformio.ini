; comparar com outputs/verify_host_baseline.csv. Uso:
; pio run -e verify_gains -t upload -t monitor
[env:verify_gains]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
board_build.f_cpu = 240000000L
