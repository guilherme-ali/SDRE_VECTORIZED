; Benchmark standalone dos solvers DARE em ESP32-S3 (com FPU de hardware) -
; gera outputs/s3/serial_capture_bateria_s3.txt (Tabela 2 do artigo).
; Uso: pio run -e benchmark_s3 -t upload --upload-port COM4
[env:benchmark_s3]
extra_scripts = pre:scripts/build_stamp.py
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
board_build.f_cpu = 240000000L
build_src_filter = -<*> +<../experiments/benchmark_solvers.cpp>
build_flags =
    ; O DevKitC-1 expoe duas portas USB: a ponte UART e a USB nativa do S3.
    ; Com a ponte UART desconectada, so a nativa (VID 303A) aparece, e por
    ; padrao (CDC_ON_BOOT=0) `Serial` sai pela UART0 — a captura via porta
    ; nativa via so o log da ROM e depois silencio. Redireciona `Serial` para
    ; o CDC nativo para que a bateria seja capturavel pela unica porta que ha.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -DFXQ_INSTRUMENT
    -std=gnu++17
    -O3
    -ffast-math
    -funroll-loops
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2
