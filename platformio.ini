; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Sem isto, `pio run` sem argumentos compilaria os 11 envs abaixo. O firmware
; de voo (esp32-s2-saola-1) e o unico que deve rodar por padrao.
default_envs = esp32-s2-saola-1

[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
monitor_filters = default, log2file
board_build.f_cpu = 240000000L
build_flags =
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -std=gnu++17
	-O3
	-ffast-math
	-funroll-loops
	-Wl,-Map=.pio/build/esp32-s2-saola-1/output.map
	; -flto tentado e descartado: o SCons deste platform espressif32 invoca
	; ld.exe diretamente (nao via driver gcc), entao objetos LTO quebram o link
	; ("plugin needed to handle lto object") sem cirurgia adicional no
	; build system. Mitigacao aplicada em vez disso: qmul/qdiv viraram
	; `inline` no header (FixedPointQ.h) e o rastreio de max_abs_seen saiu do
	; caminho quente por padrao (-DFXQ_INSTRUMENT) — ver Secao 10 da auditoria.
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2
	arduino-libraries/Madgwick@^1.2.0
	adafruit/Adafruit MPU6050@^2.2.6

; Benchmark standalone dos solvers DARE (experiments/benchmark_solvers.cpp) —
; nao faz parte do firmware de voo. Uso: pio run -e benchmark -t upload -t monitor
; (ver plano da auditoria, Fase 5, e docs/auditoria_solvers_riccati.md).
[env:benchmark]
extra_scripts = pre:scripts/build_stamp.py
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
; 921600: a bateria das 6 trajetorias emite 800k+ linhas CSV pelo serial;
; a 115200 a transmissao passaria a dominar o tempo total do benchmark
; (ver cabecalho de experiments/benchmark_solvers.cpp).
monitor_speed = 921600
board_build.f_cpu = 240000000L
build_src_filter = -<*> +<../experiments/benchmark_solvers.cpp>
build_flags =
    -DEIGEN_NO_DEBUG
    -DEIGEN_DONT_VECTORIZE
    -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT
    -DFXQ_INSTRUMENT
    -std=gnu++17
    -O3
    -ffast-math
    -funroll-loops
lib_deps =
	hideakitai/ArduinoEigen @ ^0.2.2

; Verificacao on-device dos solvers corrigidos (test/bench/verify_gains_onboard.cpp)
